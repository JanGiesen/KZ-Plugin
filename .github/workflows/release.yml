name: Release plugin zip

on:
  push:
    tags:
      - 'kz-plugin-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag om te (her)publiceren, bijv. kz-plugin-v8.1.0 (handig om een release te herstellen zonder een nieuwe tag te hoeven pushen)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Bepaal tag
        id: tagname
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tagname.outputs.tag }}

      - name: Bepaal plugin uit tag
        id: vars
        run: |
          TAG="${{ steps.tagname.outputs.tag }}"
          if [[ "$TAG" == kz-plugin-v* ]]; then
            echo "plugin_dir=kz-plugin" >> "$GITHUB_OUTPUT"
            echo "zip_name=kz-plugin.zip" >> "$GITHUB_OUTPUT"
          else
            echo "Onbekend tag-formaat: $TAG" >&2
            exit 1
          fi

      - name: Controleer versie (tag, header en constante gelijk)
        run: |
          TAG="${{ steps.tagname.outputs.tag }}"
          WIL="${TAG#kz-plugin-v}"
          BESTAND="${{ steps.vars.outputs.plugin_dir }}/kz-plugin.php"
          HEADER=$(sed -n 's/^ \* Version: *//p' "$BESTAND" | head -1 | tr -d '[:space:]')
          CONST=$(sed -n "s/^define( 'KZ_PLUGIN_VERSION', '\([^']*\)' );/\1/p" "$BESTAND" | head -1)
          echo "tag=$WIL header=$HEADER constante=$CONST"
          if [ "$WIL" != "$HEADER" ] || [ "$WIL" != "$CONST" ]; then
            echo "::error::Versie klopt niet: tag $WIL, header $HEADER, KZ_PLUGIN_VERSION $CONST. Anders biedt WordPress steeds opnieuw een update aan." >&2
            exit 1
          fi

      - name: Bouw zip
        run: |
          mkdir -p dist
          zip -r -q "dist/${{ steps.vars.outputs.zip_name }}" "${{ steps.vars.outputs.plugin_dir }}" -x "*.DS_Store"

      - name: Publiceer zip op de GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # De standaard manier om een release te maken is via de GitHub-website
          # (Releases -> "Draft a new release" -> tag aanmaken bij publiceren),
          # omdat deze CI-omgeving geen git-tags mag pushen. Die website-flow
          # maakt de release (en dus de tag) al aan, zonder zip-asset; deze
          # stap hoeft dan alleen nog de zip te uploaden. Bestaat de release
          # nog niet (bijv. tag rechtstreeks gepusht), dan maakt dit 'm alsnog.
          TAG="${{ steps.tagname.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/${{ steps.vars.outputs.zip_name }}" \
              --clobber
          else
            gh release create "$TAG" \
              "dist/${{ steps.vars.outputs.zip_name }}" \
              --title "$TAG" \
              --generate-notes
          fi
