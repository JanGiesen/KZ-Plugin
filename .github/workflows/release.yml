name: Release plugin zip

on:
  push:
    tags:
      - 'kz-plugin-v*'
      - 'kz-contentmanager-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bepaal plugin uit tag
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == kz-plugin-v* ]]; then
            echo "plugin_dir=kz-plugin" >> "$GITHUB_OUTPUT"
            echo "zip_name=kz-plugin.zip" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == kz-contentmanager-v* ]]; then
            echo "plugin_dir=kz-contentmanager-plugin" >> "$GITHUB_OUTPUT"
            echo "zip_name=kz-contentmanager-plugin.zip" >> "$GITHUB_OUTPUT"
          else
            echo "Onbekend tag-formaat: $TAG" >&2
            exit 1
          fi

      - name: Bouw zip
        run: |
          mkdir -p dist
          zip -r -q "dist/${{ steps.vars.outputs.zip_name }}" "${{ steps.vars.outputs.plugin_dir }}" -x "*.DS_Store"

      - name: Maak GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${{ steps.vars.outputs.zip_name }}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
